<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<title>HEM-7271T 血圧フォト記録 v10</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--danger:#b91c1c;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:800px;margin:auto;padding:18px 14px 44px}
h1{font-size:24px;margin:6px 0}.sub,.status{color:var(--muted);font-size:14px;line-height:1.55}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:13px}
button,.filebtn{display:inline-block;border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer}
.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:var(--danger)}
input[type=file]{display:none}
input[type=number],input[type=date],input[type=text],input[type=range]{width:100%}
input[type=number],input[type=date],input[type=text]{padding:11px;border:1px solid var(--line);border-radius:11px;font-size:16px}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
#stage,#rectStage{position:relative;margin-top:12px;touch-action:none;user-select:none}
#photoCanvas,#rectified{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:14px;background:#eee}
.handle{position:absolute;width:28px;height:28px;border-radius:50%;background:#111827;border:4px solid #fff;box-shadow:0 1px 6px #0005;transform:translate(-50%,-50%);touch-action:none}
.guide{position:absolute;border:2px dashed #111827;pointer-events:none}
.digitbox{position:absolute;border:2px solid var(--blue);background:#2563eb18;border-radius:8px;touch-action:none}
.digitbox span{position:absolute;left:2px;top:2px;background:var(--blue);color:#fff;border-radius:5px;padding:2px 5px;font-size:10px;font-weight:700}
.notice{padding:10px 12px;border-radius:12px;background:#fff7ed;font-size:13px;line-height:1.5;margin-top:10px}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.result{background:#f9fafb;border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center}
.result b{display:block;font-size:22px}.result span{font-size:11px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:11px;background:#f9fafb;border:1px solid var(--line);border-radius:13px}.stat b{font-size:19px;display:block}.stat span{font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse}th,td{padding:9px 5px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}th{color:var(--muted)}
svg{width:100%;height:230px;display:block}
.range{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;margin-top:10px}
.debug{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.grid .datebox{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
<h1>HEM-7271T 血圧フォト記録 v10</h1>
<div class="sub">局所コントラストで7セグを直接判定</div>

<div class="card">
 <div class="row">
  <label class="filebtn" for="photo">📷 撮影 / 写真を選択</label>
  <input id="photo" type="file" accept="image/*" capture="environment">
  <button id="rectifyBtn" class="secondary" disabled>液晶を補正</button>
 </div>

 <div id="stage" style="display:none">
  <canvas id="photoCanvas"></canvas>
  <div id="guide" class="guide"></div>
  <div class="handle" data-i="0"></div><div class="handle" data-i="1"></div>
  <div class="handle" data-i="2"></div><div class="handle" data-i="3"></div>
 </div>
 <div class="notice">4つの丸をLCD面の四隅へ合わせてから「液晶を補正」を押してください。</div>
</div>

<div class="card">
 <strong>数字枠の位置合わせ</strong>
 <div class="sub">青い枠を各数字に重ねます。保存済み位置は自動で呼び出します。</div>
 <div id="rectStage" style="display:none"><canvas id="rectified" width="900" height="700"></canvas></div>
 <div class="row" style="margin-top:10px">
  <button id="readBtn" disabled>読み取る</button>
  <button id="saveCalibBtn" class="secondary" disabled>枠位置を保存</button>
  <button id="resetBoxesBtn" class="secondary" disabled>枠を初期位置へ</button>
 </div>
 <div class="range">
   <label>セグメント判定感度</label><span id="sensLabel">10</span>
   <input id="sensitivity" type="range" min="2" max="30" value="10">
   <span></span>
 </div>
 <div id="status" class="status" style="padding-top:10px">写真を選択してください。</div>

 <div id="results" class="results" style="display:none">
  <div class="result"><span>上 SYS</span><b id="rSys">—</b></div>
  <div class="result"><span>下 DIA</span><b id="rDia">—</b></div>
  <div class="result"><span>脈拍</span><b id="rPulse">—</b></div>
 </div>
 <div id="debug" class="debug" style="display:none"></div>
</div>

<div class="card">
 <div class="grid">
  <div class="datebox"><label>日付</label><input id="date" type="date"></div>
  <div><label>上 mmHg</label><input id="sys" type="number"></div>
  <div><label>下 mmHg</label><input id="dia" type="number"></div>
  <div><label>脈拍 /分</label><input id="pulse" type="number"></div>
  <div><label>メモ</label><input id="memo" type="text" placeholder="朝・飲酒前など"></div>
 </div>
 <div style="height:12px"></div><button id="saveBtn">確認して保存</button>
</div>

<div class="card">
 <div class="stats">
  <div class="stat"><b id="latest">—</b><span>最新 上/下</span></div>
  <div class="stat"><b id="avg">—</b><span>平均 上/下</span></div>
  <div class="stat"><b id="count">0</b><span>記録件数</span></div>
 </div>
</div>

<div class="card"><strong>血圧推移</strong><svg id="chart" viewBox="0 0 700 230" preserveAspectRatio="none"></svg></div>
<div class="card"><div class="row"><strong class="grow">履歴</strong><button id="csvBtn" class="secondary">CSV</button><button id="clearBtn" class="danger">全削除</button></div><div id="history"></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const KEY="bp_hem7271t_v10", CALKEY="bp_hem7271t_digitboxes_v10";
$("date").value=new Date().toISOString().slice(0,10);
$("sensitivity").oninput=()=>{$("sensLabel").textContent=$("sensitivity").value};

let src=null,pts=[],boxes=[];
const pc=$("photoCanvas"),pctx=pc.getContext("2d",{willReadFrequently:true}),stage=$("stage");
const rc=$("rectified"),rctx=rc.getContext("2d",{willReadFrequently:true}),rectStage=$("rectStage");
const handles=[...document.querySelectorAll(".handle")];

const DEFAULT_BOXES=[
 {id:"s1",label:"SYS1",group:"sys",x:.27,y:.12,w:.14,h:.28},
 {id:"s2",label:"SYS2",group:"sys",x:.41,y:.12,w:.14,h:.28},
 {id:"s3",label:"SYS3",group:"sys",x:.55,y:.12,w:.14,h:.28},
 {id:"d1",label:"DIA1",group:"dia",x:.39,y:.40,w:.14,h:.27},
 {id:"d2",label:"DIA2",group:"dia",x:.53,y:.40,w:.14,h:.27},
 {id:"p1",label:"P1",group:"pulse",x:.50,y:.69,w:.11,h:.18},
 {id:"p2",label:"P2",group:"pulse",x:.61,y:.69,w:.11,h:.18}
];

const MAP={"1111110":0,"0110000":1,"1101101":2,"1111001":3,"0110011":4,"1011011":5,"1011111":6,"1110000":7,"1111111":8,"1111011":9};

// each segment has a broad target rectangle + nearby background rectangles.
// coordinates are within a single digit box.
const SEGMENTS={
 a:{seg:[.22,.04,.78,.20],bg:[[.22,.22,.78,.31]]},
 b:{seg:[.67,.12,.96,.47],bg:[[.47,.14,.60,.44]]},
 c:{seg:[.67,.53,.96,.88],bg:[[.47,.56,.60,.86]]},
 d:{seg:[.22,.80,.78,.97],bg:[[.22,.69,.78,.77]]},
 e:{seg:[.04,.53,.33,.88],bg:[[.40,.56,.53,.86]]},
 f:{seg:[.04,.12,.33,.47],bg:[[.40,.14,.53,.44]]},
 g:{seg:[.22,.42,.78,.60],bg:[[.22,.32,.78,.39],[.22,.63,.78,.70]]}
};
const ORDER=["a","b","c","d","e","f","g"];

function loadImage(f){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(f)})}

$("photo").onchange=async e=>{
 const f=e.target.files?.[0];if(!f)return;
 src=await loadImage(f);
 const maxW=1000,scale=Math.min(1,maxW/src.naturalWidth);
 pc.width=Math.round(src.naturalWidth*scale);pc.height=Math.round(src.naturalHeight*scale);
 pctx.drawImage(src,0,0,pc.width,pc.height);
 stage.style.display="block";
 pts=[{x:pc.width*.29,y:pc.height*.20},{x:pc.width*.79,y:pc.height*.20},{x:pc.width*.79,y:pc.height*.66},{x:pc.width*.29,y:pc.height*.66}];
 positionHandles();$("rectifyBtn").disabled=false;
 $("status").textContent="4つの丸をLCD面の四隅に合わせてください。";
};

function positionHandles(){
 const r=pc.getBoundingClientRect(),sx=r.width/pc.width,sy=r.height/pc.height;
 handles.forEach((h,i)=>{h.style.left=(pts[i].x*sx)+"px";h.style.top=(pts[i].y*sy)+"px"});
 const g=$("guide"),xs=pts.map(p=>p.x*sx),ys=pts.map(p=>p.y*sy);
 g.style.left=Math.min(...xs)+"px";g.style.top=Math.min(...ys)+"px";
 g.style.width=(Math.max(...xs)-Math.min(...xs))+"px";g.style.height=(Math.max(...ys)-Math.min(...ys))+"px";
}
window.addEventListener("resize",()=>{positionHandles();positionBoxes()});
handles.forEach(h=>{
 const i=Number(h.dataset.i);
 h.onpointerdown=e=>{
  e.preventDefault();h.setPointerCapture(e.pointerId);
  h.onpointermove=ev=>{
   const r=pc.getBoundingClientRect();
   pts[i].x=Math.max(0,Math.min(pc.width,(ev.clientX-r.left)*pc.width/r.width));
   pts[i].y=Math.max(0,Math.min(pc.height,(ev.clientY-r.top)*pc.height/r.height));
   positionHandles();
  };
  h.onpointerup=()=>h.onpointermove=null;
 };
});

function rectify(){
 const ow=rc.width,oh=rc.height,[tl,tr,br,bl]=pts;
 const srcData=pctx.getImageData(0,0,pc.width,pc.height),dst=rctx.createImageData(ow,oh);
 for(let y=0;y<oh;y++){
  const v=y/(oh-1);
  for(let x=0;x<ow;x++){
   const u=x/(ow-1);
   const sx=(1-u)*(1-v)*tl.x+u*(1-v)*tr.x+u*v*br.x+(1-u)*v*bl.x;
   const sy=(1-u)*(1-v)*tl.y+u*(1-v)*tr.y+u*v*br.y+(1-u)*v*bl.y;
   const ix=Math.max(0,Math.min(pc.width-1,Math.round(sx))),iy=Math.max(0,Math.min(pc.height-1,Math.round(sy)));
   const si=(iy*pc.width+ix)*4,di=(y*ow+x)*4;
   dst.data[di]=srcData.data[si];dst.data[di+1]=srcData.data[si+1];dst.data[di+2]=srcData.data[si+2];dst.data[di+3]=255;
  }
 }
 rctx.putImageData(dst,0,0);rectStage.style.display="block";
 try{boxes=JSON.parse(localStorage.getItem(CALKEY)||"null")||structuredClone(DEFAULT_BOXES)}catch{boxes=structuredClone(DEFAULT_BOXES)}
 makeBoxes();positionBoxes();
 ["readBtn","saveCalibBtn","resetBoxesBtn"].forEach(id=>$(id).disabled=false);
 $("status").textContent="青い枠を各数字に合わせてください。";
}
$("rectifyBtn").onclick=rectify;

function makeBoxes(){
 [...rectStage.querySelectorAll(".digitbox")].forEach(x=>x.remove());
 boxes.forEach((b,i)=>{
  const d=document.createElement("div");d.className="digitbox";d.dataset.i=i;
  const s=document.createElement("span");s.textContent=b.label;d.appendChild(s);rectStage.appendChild(d);
  d.onpointerdown=e=>{
   e.preventDefault();d.setPointerCapture(e.pointerId);
   const sx=e.clientX,sy=e.clientY,start={x:b.x,y:b.y},r=rc.getBoundingClientRect();
   d.onpointermove=ev=>{
    b.x=Math.max(0,Math.min(1-b.w,start.x+(ev.clientX-sx)/r.width));
    b.y=Math.max(0,Math.min(1-b.h,start.y+(ev.clientY-sy)/r.height));
    positionBoxes();
   };
   d.onpointerup=()=>d.onpointermove=null;
  };
 });
}
function positionBoxes(){
 const r=rc.getBoundingClientRect();
 [...rectStage.querySelectorAll(".digitbox")].forEach(d=>{
  const b=boxes[Number(d.dataset.i)];
  d.style.left=(b.x*r.width)+"px";d.style.top=(b.y*r.height)+"px";
  d.style.width=(b.w*r.width)+"px";d.style.height=(b.h*r.height)+"px";
 });
}
$("saveCalibBtn").onclick=()=>{localStorage.setItem(CALKEY,JSON.stringify(boxes));$("status").textContent="数字枠の位置を保存しました。"};
$("resetBoxesBtn").onclick=()=>{boxes=structuredClone(DEFAULT_BOXES);makeBoxes();positionBoxes();$("status").textContent="数字枠を初期位置へ戻しました。"};

function grayMean(rect,b){
 const [x1,y1,x2,y2]=rect;
 const ox=b.x*rc.width,oy=b.y*rc.height,bw=b.w*rc.width,bh=b.h*rc.height;
 const sx=Math.max(0,Math.floor(ox+x1*bw)),sy=Math.max(0,Math.floor(oy+y1*bh));
 const ex=Math.min(rc.width,Math.ceil(ox+x2*bw)),ey=Math.min(rc.height,Math.ceil(oy+y2*bh));
 const d=rctx.getImageData(sx,sy,Math.max(1,ex-sx),Math.max(1,ey-sy)).data;
 let sum=0,n=0;
 for(let i=0;i<d.length;i+=4){
   const g=.299*d[i]+.587*d[i+1]+.114*d[i+2];
   // robust-ish clipping to reduce fine moire influence
   sum+=Math.max(20,Math.min(235,g));n++;
 }
 return n?sum/n:255;
}

function segmentContrast(def,b){
 const seg=grayMean(def.seg,b);
 const bgs=def.bg.map(r=>grayMean(r,b));
 const bg=bgs.reduce((a,c)=>a+c,0)/bgs.length;
 return bg-seg; // positive => segment darker than local background
}

function recognizeDigit(b){
 const contrasts=ORDER.map(k=>segmentContrast(SEGMENTS[k],b));
 const sens=Number($("sensitivity").value);
 const bits=contrasts.map(v=>v>sens?"1":"0").join("");
 if(MAP[bits]!==undefined)return {n:MAP[bits],bits,contrasts,dist:0};

 let best={n:null,dist:99};
 for(const [pat,n] of Object.entries(MAP)){
   let dist=0;
   for(let i=0;i<7;i++){
     // weight mismatches more when measured contrast is far from threshold
     if(pat[i]!==bits[i]) dist += 1 + Math.min(1,Math.abs(contrasts[i]-sens)/20);
   }
   if(dist<best.dist)best={n:Number(n),dist};
 }
 return {n:best.dist<=2.2?best.n:null,bits,contrasts,dist:best.dist};
}

function groupValue(group){
 const rs=boxes.filter(b=>b.group===group).map(recognizeDigit);
 return {rs,value:rs.every(r=>r.n!==null)?Number(rs.map(r=>r.n).join("")):null};
}

function candidateValue(group){
 const parts=boxes.filter(b=>b.group===group).map(b=>{
   const r=recognizeDigit(b);
   let opts=[];
   for(const [pat,n] of Object.entries(MAP)){
     let score=0;
     for(let i=0;i<7;i++){
       const target=pat[i]==="1" ? 18 : 0;
       score += Math.abs(r.contrasts[i]-target);
     }
     opts.push({digit:Number(n),score});
   }
   opts.sort((a,b)=>a.score-b.score);
   return opts.slice(0,3);
 });
 let combos=[{digits:"",score:0}];
 parts.forEach(arr=>{
   let next=[];
   combos.forEach(base=>arr.forEach(o=>next.push({digits:base.digits+o.digit,score:base.score+o.score})));
   combos=next.sort((a,b)=>a.score-b.score).slice(0,40);
 });
 return combos.map(c=>({...c,value:Number(c.digits)})).filter(c=>{
   if(group==="sys")return c.value>=70&&c.value<=250;
   if(group==="dia")return c.value>=35&&c.value<=150;
   return c.value>=35&&c.value<=200;
 });
}

$("readBtn").onclick=()=>{
 const direct={sys:groupValue("sys"),dia:groupValue("dia"),pulse:groupValue("pulse")};
 let S=candidateValue("sys"),D=candidateValue("dia"),P=candidateValue("pulse");
 let best=null;
 for(const s of S.slice(0,12))for(const d of D.slice(0,12))for(const p of P.slice(0,12)){
   if(s.value<=d.value)continue;
   let score=s.score+d.score+p.score;
   if(s.value-d.value<20||s.value-d.value>110)score+=30;
   if(d.value<45||d.value>110)score+=15;
   if(p.value<45||p.value>130)score+=10;
   if(!best||score<best.score)best={s,d,p,score};
 }
 $("results").style.display="grid";$("debug").style.display="block";
 if(best){
   $("rSys").textContent=best.s.value;$("rDia").textContent=best.d.value;$("rPulse").textContent=best.p.value;
   $("sys").value=best.s.value;$("dia").value=best.d.value;$("pulse").value=best.p.value;
 }else{
   $("rSys").textContent=$("rDia").textContent=$("rPulse").textContent="?";
 }
 const fmt=(g)=>direct[g].rs.map(r=>`${r.n??"?"}[${r.bits}](${r.contrasts.map(v=>v.toFixed(1)).join(",")})`).join(" / ");
 $("debug").textContent=
  `SYS ${fmt("sys")}\nDIA ${fmt("dia")}\nPULSE ${fmt("pulse")}\n`+
  (best?`整合候補: ${best.s.value}/${best.d.value} 脈拍${best.p.value}`:"整合候補なし");
 $("status").textContent=best?`候補：${best.s.value}/${best.d.value}、脈拍 ${best.p.value}。写真と照合してください。`:"判定できませんでした。感度や枠位置を調整してください。";
};

function load(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch{return[]}}
function persist(r){localStorage.setItem(KEY,JSON.stringify(r))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("saveBtn").onclick=()=>{
 const sys=Number($("sys").value),dia=Number($("dia").value),pulse=Number($("pulse").value||0);
 if(!sys||!dia||sys<=dia){alert("血圧の数値を確認してください。");return}
 if(!confirm(`${sys}/${dia} mmHg${pulse?` 脈拍 ${pulse}`:""} を保存しますか？`))return;
 const r=load();r.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),date:$("date").value,sys,dia,pulse:pulse||null,memo:$("memo").value.trim()});persist(r);render();
};
window.delRec=id=>{persist(load().filter(r=>r.id!==id));render()};
function render(){
 const r=load().sort((a,b)=>a.date.localeCompare(b.date));$("count").textContent=r.length;$("latest").textContent=r.length?`${r.at(-1).sys}/${r.at(-1).dia}`:"—";
 $("avg").textContent=r.length?`${(r.reduce((s,x)=>s+x.sys,0)/r.length).toFixed(0)}/${(r.reduce((s,x)=>s+x.dia,0)/r.length).toFixed(0)}`:"—";
 $("history").innerHTML=r.length?`<table><thead><tr><th>日付</th><th>血圧</th><th>脈拍</th><th>メモ</th><th></th></tr></thead><tbody>${[...r].reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${x.sys}/${x.dia}</td><td>${x.pulse??"—"}</td><td>${esc(x.memo)}</td><td><button class="danger" onclick="delRec('${x.id}')">削除</button></td></tr>`).join("")}</tbody></table>`:`<div class="status">まだ記録がありません。</div>`;draw(r)
}
function draw(r){
 const svg=$("chart"),W=700,H=230,p=30;if(!r.length){svg.innerHTML=`<text x="350" y="115" text-anchor="middle" fill="#9ca3af">記録するとグラフが表示されます</text>`;return}
 const vals=r.flatMap(x=>[x.sys,x.dia]),min=Math.min(...vals)-10,max=Math.max(...vals)+10,x=i=>p+(r.length===1?(W-2*p)/2:i*(W-2*p)/(r.length-1)),y=v=>H-p-(v-min)*(H-2*p)/(max-min),pts=f=>r.map((a,i)=>`${x(i)},${y(a[f])}`).join(" ");
 svg.innerHTML=`<polyline points="${pts("sys")}" fill="none" stroke="#111827" stroke-width="3"/><polyline points="${pts("dia")}" fill="none" stroke="#6b7280" stroke-width="3"/>`
}
$("clearBtn").onclick=()=>{if(confirm("全記録を削除しますか？")){localStorage.removeItem(KEY);render()}};
$("csvBtn").onclick=()=>{const r=load(),rows=[["date","systolic","diastolic","pulse","memo"],...r.map(x=>[x.date,x.sys,x.dia,x.pulse??"",x.memo||""])],csv=rows.map(row=>row.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));a.download="blood_pressure.csv";a.click()};
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body></html>
